version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ovenxpress-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ovenxpress
    volumes:
      - mongodb_data:/data/db
    networks:
      - ovenxpress-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ovenxpress-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ovenxpress
    depends_on:
      - mongodb
    networks:
      - ovenxpress-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: ovenxpress-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ovenxpress-network

volumes:
  mongodb_data:

networks:
  ovenxpress-network:
    driver: bridge
